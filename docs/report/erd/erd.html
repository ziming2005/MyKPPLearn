<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyKPP Learn ERD</title>
<style>
body{margin:0;background:#fff;color:#111;font:16px/1.5 Arial,sans-serif;padding:16px}
h1{font-size:22px;margin:0 0 6px}p{margin:0 0 16px}button{font:inherit;padding:6px 14px;margin:0 0 12px;cursor:pointer}
#c{overflow:auto}.err{color:#b00020}
</style></head><body>
<h1>MyKPP Learn ERD</h1>
<p>Click Download PNG, then replace Figure 9 in the report (right-click, Change Picture, From a File).</p>
<button id="dl" type="button">Download PNG</button>
<div id="c"></div>
<script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs';
const src = "erDiagram\n    Users {\n        int UserId PK\n        nvarchar FullName\n        nvarchar Email UK\n        nvarchar PasswordHash\n        nvarchar Role\n        nvarchar ProfileImagePath\n        nvarchar Status\n        datetime2 CreatedAt\n        datetime2 UpdatedAt\n        nvarchar GoogleSubjectId UK\n    }\n    PasswordResetTokens {\n        int TokenId PK\n        int UserId FK\n        char TokenHash\n        datetime2 ExpiresAt\n        datetime2 UsedAt\n        datetime2 CreatedAt\n        int FailedAttempts\n        datetime2 VerifiedAt\n    }\n    LearningChapters {\n        int ChapterId PK\n        nvarchar Title\n        nvarchar Description\n        int DisplayOrder UK\n        bit IsActive\n        datetime2 CreatedAt\n        datetime2 UpdatedAt\n    }\n    Lessons {\n        int LessonId PK\n        int ChapterId FK\n        nvarchar Title\n        nvarchar Content\n        nvarchar ImagePath\n        int DisplayOrder\n        bit IsActive\n        datetime2 CreatedAt\n        datetime2 UpdatedAt\n        nvarchar ImagePosition\n    }\n    LearningProgress {\n        int LearningProgressId PK\n        int UserId FK\n        int LessonId FK\n        datetime2 CompletedAt\n    }\n    QuestionCategories {\n        int QuestionCategoryId PK\n        nvarchar Code UK\n        nvarchar Title\n        nvarchar Description\n        int DisplayOrder UK\n        bit IsActive\n        datetime2 CreatedAt\n        datetime2 UpdatedAt\n    }\n    PracticeSets {\n        int PracticeSetId PK\n        int QuestionCategoryId FK\n        int SetNumber\n        bit IsActive\n        datetime2 CreatedAt\n        datetime2 UpdatedAt\n    }\n    Questions {\n        int QuestionId PK\n        int QuestionCategoryId FK\n        int PracticeSetId FK\n        nvarchar QuestionText\n        nvarchar Explanation\n        nvarchar ImagePath\n        bit IsActive\n        datetime2 CreatedAt\n        datetime2 UpdatedAt\n    }\n    QuestionOptions {\n        int QuestionOptionId PK\n        int QuestionId FK\n        nvarchar OptionText\n        int OptionOrder\n        bit IsCorrect\n    }\n    PracticeAttempts {\n        int PracticeAttemptId PK\n        int UserId FK\n        int PracticeSetId FK\n        datetime2 StartedAt\n        datetime2 CompletedAt\n        int TotalQuestions\n        int CorrectCount\n        int UnansweredCount\n    }\n    PracticeAttemptQuestions {\n        int PracticeAttemptQuestionId PK\n        int PracticeAttemptId FK\n        int QuestionId\n        int QuestionNumber\n        int SelectedOptionId\n        bit IsCorrect\n        nvarchar QuestionTextSnapshot\n        nvarchar ExplanationSnapshot\n        nvarchar OptionATextSnapshot\n        nvarchar OptionBTextSnapshot\n        nvarchar OptionCTextSnapshot\n        char CorrectOptionSnapshot\n        char SelectedOptionSnapshot\n        nvarchar SelectedOptionTextSnapshot\n        nvarchar ImagePathSnapshot\n    }\n    MockExamSets {\n        int MockExamSetId PK\n        nvarchar ExamTypeCode\n        int SetNumber\n        bit IsActive\n        datetime2 CreatedAt\n        datetime2 UpdatedAt\n    }\n    MockExamSetQuestions {\n        int MockExamSetQuestionId PK\n        int MockExamSetId FK\n        int QuestionId FK\n        int DisplayOrder\n    }\n    MockExamAttempts {\n        int MockExamAttemptId PK\n        int UserId FK\n        int MockExamSetId FK\n        datetime2 StartedAt\n        datetime2 CompletedAt\n        int ColourBlindCorrect\n        int ColourBlindTotal\n        int TheoryCorrect\n        int TheoryTotal\n        bit IsPassed\n        int TimeTakenSeconds\n        bit AutoSubmitted\n    }\n    MockExamAttemptQuestions {\n        int MockExamAttemptQuestionId PK\n        int MockExamAttemptId FK\n        int QuestionId\n        int QuestionNumber\n        int SelectedOptionId\n        bit IsCorrect\n        bit IsFlagged\n        nvarchar QuestionTextSnapshot\n        nvarchar ExplanationSnapshot\n        nvarchar OptionATextSnapshot\n        nvarchar OptionBTextSnapshot\n        nvarchar OptionCTextSnapshot\n        char CorrectOptionSnapshot\n        char SelectedOptionSnapshot\n        nvarchar SelectedOptionTextSnapshot\n        nvarchar ImagePathSnapshot\n        nvarchar QuestionCategoryCodeSnapshot\n    }\n    HiddenRoadSignAssets {\n        int RoadSignAssetId PK\n        nvarchar Name\n        nvarchar ImagePath\n        bit IsActive\n        datetime2 CreatedAt\n        datetime2 UpdatedAt\n    }\n    HiddenRoadSignPractices {\n        int HiddenRoadSignPracticeId PK\n        int SetNumber UK\n        nvarchar SceneImagePath\n        bit IsActive\n        datetime2 CreatedAt\n        datetime2 UpdatedAt\n    }\n    HiddenRoadSignItems {\n        int HiddenRoadSignItemId PK\n        int HiddenRoadSignPracticeId FK\n        int RoadSignAssetId FK\n        nvarchar QuestionText\n        nvarchar Explanation\n        decimal HotspotXPercent\n        decimal HotspotYPercent\n        decimal HotspotWidthPercent\n        decimal HotspotHeightPercent\n        bit IsConfigured\n        datetime2 CreatedAt\n        datetime2 UpdatedAt\n    }\n    HiddenRoadSignChoices {\n        int HiddenRoadSignChoiceId PK\n        int HiddenRoadSignItemId FK\n        nvarchar ChoiceText\n        int DisplayOrder\n        bit IsCorrect\n    }\n    HiddenRoadSignAttempts {\n        int HiddenRoadSignAttemptId PK\n        int UserId FK\n        int HiddenRoadSignPracticeId FK\n        datetime2 StartedAt\n        datetime2 CompletedAt\n        int CorrectCount\n        int TotalItems\n    }\n    HiddenRoadSignAttemptAnswers {\n        int HiddenRoadSignAttemptAnswerId PK\n        int HiddenRoadSignAttemptId FK\n        int HiddenRoadSignItemId FK\n        int SelectedChoiceId FK\n        bit IsCorrect\n        int FoundOrder\n    }\n    Users ||--o{ PasswordResetTokens : requests\n    LearningChapters ||--o{ Lessons : contains\n    Users ||--o{ LearningProgress : completes\n    Lessons ||--o{ LearningProgress : tracked_by\n    QuestionCategories ||--o{ PracticeSets : groups\n    QuestionCategories ||--o{ Questions : categorises\n    PracticeSets |o--o{ Questions : contains\n    Questions ||--|{ QuestionOptions : has\n    Users ||--o{ PracticeAttempts : performs\n    PracticeSets ||--o{ PracticeAttempts : attempted_as\n    PracticeAttempts ||--|{ PracticeAttemptQuestions : contains\n    MockExamSets ||--o{ MockExamSetQuestions : contains\n    Questions ||--o{ MockExamSetQuestions : selected_for\n    Users ||--o{ MockExamAttempts : performs\n    MockExamSets ||--o{ MockExamAttempts : attempted_as\n    MockExamAttempts ||--|{ MockExamAttemptQuestions : contains\n    HiddenRoadSignPractices ||--o{ HiddenRoadSignItems : contains\n    HiddenRoadSignAssets ||--o{ HiddenRoadSignItems : used_by\n    HiddenRoadSignItems ||--o{ HiddenRoadSignChoices : has\n    Users ||--o{ HiddenRoadSignAttempts : performs\n    HiddenRoadSignPractices ||--o{ HiddenRoadSignAttempts : attempted_as\n    HiddenRoadSignAttempts ||--|{ HiddenRoadSignAttemptAnswers : contains\n    HiddenRoadSignItems ||--o{ HiddenRoadSignAttemptAnswers : answered\n    HiddenRoadSignChoices ||--o{ HiddenRoadSignAttemptAnswers : selected\n";
mermaid.initialize({startOnLoad:false, securityLevel:'loose', theme:'base',
  themeVariables:{primaryColor:'#ffffff',primaryBorderColor:'#111111',primaryTextColor:'#111111',lineColor:'#111111',secondaryColor:'#f4f4f4',tertiaryColor:'#ffffff',fontFamily:'Arial, sans-serif',fontSize:'14px'},
  er:{layoutDirection:'LR',minEntityWidth:150,minEntityHeight:40,entityPadding:12,useMaxWidth:false}, htmlLabels:false});
window.__status = {};
async function toPng(el){
  const box = el.viewBox.baseVal, s = 3, c = document.createElement('canvas');
  c.width = Math.ceil(box.width*s); c.height = Math.ceil(box.height*s);
  const clone = el.cloneNode(true);
  clone.setAttribute('width', box.width); clone.setAttribute('height', box.height); clone.removeAttribute('style');
  const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(clone));
  return new Promise((res, rej) => { const img = new Image(); img.onload = () => {
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/png')); }; img.onerror = rej; img.src = url; });
}
try {
  const {svg} = await mermaid.render('erd', src);
  document.getElementById('c').innerHTML = svg;
  const el = document.querySelector('#c svg');
  const b = el.viewBox.baseVal;
  window.__status = {ok:true, w:Math.round(b.width), h:Math.round(b.height), foreign: el.querySelectorAll('foreignObject').length};
  window.__toPng = () => toPng(el);
  document.getElementById('dl').onclick = async () => { const a = document.createElement('a'); a.href = await toPng(el); a.download = 'figure-9-entity-relationship-diagram.png'; a.click(); };
} catch (e) {
  document.getElementById('c').innerHTML = '<p class="err"></p>'; document.querySelector('.err').textContent = String(e);
  window.__status = {ok:false, error:String(e)};
}
window.__done = true;
</script></body></html>
